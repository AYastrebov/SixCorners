<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art comparison</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #3a3a3a;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      h2 {
        margin: 32px 0 8px;
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 4px;
      }
      .screen {
        width: 320px;
        height: 480px;
        display: block;
      }
      .tiles {
        display: grid;
        grid-template-columns: 80px repeat(12, 64px);
        gap: 6px;
        align-items: center;
        margin-top: 12px;
      }
      .tiles img {
        width: 56px;
        height: 48px;
        background: #9a9a9a;
      }
      .tiles span {
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Old (2011 PNG) vs new (SVG)</h1>
    <p>Dev-only page. Run <code>scripts/extract-legacy-art.sh</code> once to see the old art.</p>
    <main id="gallery"></main>
    <script type="module" src="/src/art-gallery.ts"></script>
  </body>
</html>
